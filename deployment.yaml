apiVersion: apps/v1
kind: Deployment
metadata:
  name: djangoserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: djangoserver
  template:
    metadata:
      labels:
        app: djangoserver
    spec:
      containers:
      - name: django
        image: djangoserver:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: djangoserver
spec:
  selector:
    app: djangoserver
  ports:
  - port: 8080
    targetPort: 8080
